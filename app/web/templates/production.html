<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Production history - EVE Manufacturing</title>
    <link rel="stylesheet" href="/static/app.css">
    <link rel="stylesheet" href="/static/navigation.css">
    <link rel="stylesheet" href="/static/production.css">
    <script defer src="/ui/config.js"></script>
    <script defer src="/static/api.js"></script>
    <script defer src="/static/production.js"></script>
    <script defer src="/static/freshness.js"></script>
    <script defer src="/static/vendor/alpine.min.js"></script>
    <link rel="stylesheet" href="/static/compact.css">
  </head>
  <body class="compact-page production-page" x-data="productionApp">
    {% set active_page = "production" %}
    {% include "navigation.html" %}
    <main class="workspace"><div class="content"><div class="page-heading"><div><h1>Production history</h1></div><div class="workspace-header-actions">{% include "workspace_help.html" %}<button class="button primary" @click="startCreate()" :disabled="busy">Create production</button></div></div>
      <p
        class="error-banner"
        x-show="error"
        x-text="error"
        role="alert"
        x-cloak
      ></p>
      <p
        class="profile-notice"
        x-show="message"
        x-text="message"
        role="status"
        x-cloak
      ></p>
      <section class="market-panel production-editor" x-show="creating" x-cloak>
        <h2>Create production</h2>
        <form @submit.prevent="create()">
          <fieldset :disabled="busy">
            <div class="filter-grid">
              <div class="blueprint-picker" @click.outside="suggestionsOpen=false">
                <label for="production-search">Blueprint or product</label><input
                  id="production-search"
                  x-model="searchText"
                  @input="invalidate()"
                  @input.debounce.300ms="search()"
                  @keydown="searchKey($event)"
                  @focus="suggestionsOpen=true"
                  type="search"
                  required
                  autocomplete="off"
                  role="combobox"
                  aria-controls="production-suggestions"
                  aria-autocomplete="list"
                  :aria-expanded="suggestionsOpen&&matches.length>0"
                  :aria-activedescendant="suggestionsOpen&&activeMatch>=0?'production-option-'+activeMatch:null"
                  placeholder="Start typing a name..."
                >
                <div
                  class="blueprint-suggestions"
                  id="production-suggestions"
                  role="listbox"
                  x-show="suggestionsOpen&&matches.length"
                >
                  <template x-for="(item,index) in matches" :key="item.type_id">
                    <div
                      role="option"
                      :id="'production-option-'+index"
                      :aria-selected="activeMatch===index"
                      :class="{'blueprint-highlight':activeMatch===index}"
                      @mousedown.prevent
                      @click="choose(item)"
                    >
                      <img
                        :src="'https://images.evetech.net/types/'+item.type_id+'/icon?size=32'"
                        alt=""
                        @error="$el.style.visibility='hidden'"
                      >
                      <span x-text="item.name"></span>
                    </div>
                  </template>
                </div>
              </div>
              <label>
                Planned finished units (optional)<input
                  type="number"
                  min="1"
                  max="1000000000"
                  step="1"
                  x-model="details.units"
                ></label><label>Comment (optional)<input x-model="details.comment" maxlength="2000">
                </label>
              </div>
              <div class="production-actions">
                <button class="button primary" :disabled="busy">Create empty production</button><button type="button" class="text-button" @click="creating=false">Cancel</button>
              </div>
            </fieldset>
          </form>
        </section>
        <template x-if="selected">
          <section class="market-panel production-editor">
            <div class="shopping-heading">
              <div class="material-name">
                <img
                  :src="'https://images.evetech.net/types/'+selected.type_id+'/icon?size=64'"
                  alt=""
                  @error="$el.style.visibility='hidden'"
                >
                <h2 x-text="selected.name"></h2>
              </div>
              <div class="production-header-actions">
                <button
                  type="button"
                  class="button production-delete"
                  @click="removeProduction()"
                  :disabled="busy"
                >
                  Delete production
                </button><button
                  type="button"
                  class="button secondary"
                  @click="selected=null"
                  :disabled="busy"
                >
                  Close
                </button>
              </div>
            </div>
            <details class="production-details">
              <summary>Batch details <span
                class="muted"
                x-text="(selected.units??'Not set')+' units | '+(selected.status==='completed'?'Completed':'In progress')"
              ></span></summary>
              <form @submit.prevent="saveDetails()">
                <fieldset :disabled="busy">
                  <div class="filter-grid">
                    <label>
                      Planned finished units<input
                        type="number"
                        min="1"
                        max="1000000000"
                        step="1"
                        x-model="details.units"
                        placeholder="Not set"
                      ></label><label>Status<select x-model="details.status">
                      <option value="in_progress">In progress</option>
                      <option value="completed">Completed</option>
                      </select></label><label>Comment<input
                        x-model="details.comment"
                        maxlength="2000"
                      >
                      </label>
                    </div>
                    <div class="production-actions">
                      <button class="button secondary" :disabled="busy">Save details</button>
                    </div>
                  </fieldset>
                </form>
              </details>
              <div class="shopping-stats production-totals">
                <div class="expense-card"><span>Total expenses</span><strong x-text="money(selected.totals.cost)+' ISK'"></strong></div>
                <div class="income-card"><span>Received from sales</span><strong x-text="money(selected.totals.income)+' ISK'"></strong></div>
                <div
                  :class="Number(selected.totals.balance)<0?'expense-card':'income-card'"
                >
                  <span>Cash balance</span><strong
                    :class="{'production-loss':Number(selected.totals.balance)<0}"
                    x-text="money(selected.totals.balance)+' ISK'"
                  ></strong>
                </div>
                <div><span>Return on recorded costs</span><strong
                  x-text="selected.totals.margin===null?'—':Number(selected.totals.margin).toFixed(1)+'%'"
                ></strong></div>
              </div>
              <section class="production-entry-section">
                <div class="production-section-heading">
                  <div>
                    <h3 x-text="editingId?'Edit transaction':'New transaction'"></h3>
                  </div>
                  <div class="production-tabs" role="group" aria-label="Transaction type">
                    <button
                      type="button"
                      class="expense-tab"
                      :aria-pressed="entry.kind!=='income'"
                      @click="resetEntry('invention')"
                      :disabled="busy"
                    >
                      − Expense
                    </button><button
                      type="button"
                      class="income-tab"
                      :aria-pressed="entry.kind==='income'"
                      @click="resetEntry('income')"
                      :disabled="busy"
                    >
                      + Income
                    </button>
                  </div>
                </div>
                <form @submit.prevent="saveEntry()">
                  <fieldset :disabled="busy">
                    <div
                      class="production-entry-layout"
                      :class="{'income-layout':entry.kind==='income'}"
                    >
                      <div class="production-entry-fields">
                        <label x-show="entry.kind!=='income'">
                          Expense category<select x-model="entry.kind">
                          <option value="invention">Invention</option>
                          <option value="materials">Materials</option>
                          <option value="manufacturing">Manufacturing</option>
                          <option value="income" hidden>Income</option>
                        </select></label><label><span x-text="entry.kind==='income'?'Received (ISK)':'Spent (ISK)'"></span><input
                          x-ref="amount"
                          type="number"
                          x-model="entry.amount"
                          min="0"
                          max="1000000000000000000"
                          step="0.01"
                          required
                          :placeholder="entry.kind==='income'?'Amount received for this sale':'Enter amount or use market estimate'"
                        ></label><label>Note (optional)<input
                          x-model="entry.comment"
                          maxlength="2000"
                          placeholder="e.g. Additional batch or partial sale"
                        >
                        </label>
                        <p
                          class="muted production-estimate-note"
                          x-show="estimateNote"
                          x-text="estimateNote"
                        ></p>
                        <div class="production-actions">
                          <button
                            class="button"
                            :class="entry.kind==='income'?'income-button':'expense-button'"
                            :disabled="busy"
                            x-text="editingId?'Save transaction':entry.kind==='income'?'+ Add income':'- Add expense'"
                          ></button><button
                            type="button"
                            class="text-button"
                            x-show="editingId"
                            @click="resetEntry()"
                            :disabled="busy"
                          >
                            Cancel edit
                          </button>
                        </div>
                      </div>
                      <aside x-show="entry.kind!=='income'" class="production-estimate">
                        <h3>Market estimate</h3>
                        <div class="filter-grid">
                          <label>
                            Finished units for this expense<input
                              type="number"
                              x-model="estimateUnits"
                              min="1"
                              max="1000000000"
                              step="1"
                              placeholder="Required for estimate"
                            ></label><label>Price hub<select x-model="hub">
                            <option value="jita">Jita</option>
                            <option value="amarr">Amarr</option>
                            <option value="dodixie">Dodixie</option>
                            <option value="rens">Rens</option>
                            <option value="hek">Hek</option>
                            </select></label><label x-show="entry.kind==='materials'">Material prices<select x-model="side">
                            <option value="sell">Sell orders · instant purchase</option>
                            <option value="buy">Buy orders</option>
                            </select></label><label x-show="entry.kind==='materials'&&side==='buy'">Buy broker (%)<input type="number" x-model="buyBroker" min="0" max="100" step="any"></label><label x-show="entry.kind==='manufacturing'">Facility tax (%)<input type="number" x-model="facilityTax" min="0" max="100" step="any"></label><label x-show="entry.kind==='manufacturing'">System cost index (%)<input type="number" x-model="systemIndex" min="0" max="100" step="any">
                            </label>
                            <div class="production-decryptor" x-show="entry.kind==='invention'">
                              <span class="decryptor-caption">Decryptor</span>
                              <p class="muted" x-show="optionsLoading">Loading decryptors...</p>
                              <p
                                class="muted"
                                x-show="!optionsLoading&&!inventionOptions.length&&!optionsError"
                              >
                                Enter finished units to choose a decryptor.
                              </p>
                              <p
                                class="error-banner"
                                x-show="optionsError"
                                x-text="optionsError"
                                role="alert"
                              ></p>
                              <button
                                type="button"
                                class="text-button"
                                x-show="optionsError"
                                @click="resetEstimate()"
                              >
                                Retry options
                              </button>
                              <details
                                class="decryptor-picker"
                                x-show="inventionOptions.length&&!optionsLoading"
                                @click.outside="$el.open=false"
                                @keydown.escape.stop="$el.open=false;$el.querySelector('summary').focus()"
                              >
                                <summary>
                                  <template x-if="selectedDecryptor?.decryptor_id">
                                    <img
                                      :src="'https://images.evetech.net/types/'+selectedDecryptor.decryptor_id+'/icon?size=64'"
                                      alt=""
                                      @error="$el.style.visibility='hidden'"
                                    >
                                  </template>
                                  <svg
                                    x-show="selectedDecryptor?.decryptor_id===null"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    aria-hidden="true"
                                  >
                                    <circle cx="12" cy="12" r="9" />
                                    <path d="M6 6l12 12" />
                                  </svg><span x-text="selectedDecryptor?.name||'Choose a decryptor'"></span><small x-show="selectedDecryptor?.is_best">Best value</small><span aria-hidden="true">▾</span>
                                </summary>
                                <div
                                  class="decryptor-choices"
                                  role="radiogroup"
                                  aria-label="Invention decryptor"
                                >
                                  <template
                                    x-for="option in inventionOptions"
                                    :key="String(option.decryptor_id)"
                                  >
                                    <label
                                      class="decryptor-option"
                                      :class="{'decryptor-unpriced':option.estimated_cost===null}"
                                    >
                                      <input
                                        type="radio"
                                        name="expense-decryptor"
                                        :value="option.decryptor_id===null?'none':String(option.decryptor_id)"
                                        x-model="decryptorChoice"
                                        :disabled="option.estimated_cost===null"
                                        @change="estimateNote=''"
                                        @click="$nextTick(()=>{const picker=$el.closest('details');picker.open=false;picker.querySelector('summary').focus()})"
                                      >
                                      <template x-if="option.decryptor_id">
                                        <img
                                          :src="'https://images.evetech.net/types/'+option.decryptor_id+'/icon?size=64'"
                                          alt=""
                                          loading="lazy"
                                          @error="$el.style.visibility='hidden'"
                                        >
                                      </template>
                                      <svg
                                        x-show="option.decryptor_id===null"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        aria-hidden="true"
                                      >
                                        <circle cx="12" cy="12" r="9" />
                                        <path d="M6 6l12 12" />
                                      </svg><span><strong x-text="option.name"></strong><small
                                        x-text="option.estimated_cost===null?'Missing prices':money(option.estimated_cost)+' ISK'"
                                      ></small></span><small class="decryptor-best" x-show="option.is_best">Best value</small>
                                    </label>
                                  </template>
                                </div>
                              </details>
                            </div>
                          </div>
                          <button
                            type="button"
                            class="button secondary"
                            @click="estimate()"
                            :disabled="busy||!estimateUnits||(entry.kind==='invention'&&(optionsLoading||!selectedDecryptor))"
                          >
                            Fill expense amount
                          </button>
                        </aside>
                      </div>
                    </fieldset>
                  </form>
                </section>
                <h3>Transaction history</h3>
                <p
                  class="muted"
                  x-show="!selected.entries.length"
                >No expenses or income recorded yet.</p>
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Amount (ISK)</th>
                        <th>Note</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="item in selected.entries" :key="item.id">
                        <tr>
                          <td x-text="new Date(item.created_at).toLocaleString()"></td>
                          <td>
                            <span
                              class="production-kind"
                              :class="item.kind==='income'?'income-tone':'expense-tone'"
                              x-text="label(item.kind)"
                            ></span>
                          </td>
                          <td
                            :class="item.kind==='income'?'income-tone':'expense-tone'"
                            x-text="(item.kind==='income'?'+':'-')+money(item.amount)"
                          ></td>
                          <td class="production-comment" x-text="item.comment"></td>
                          <td>
                            <button class="text-button" @click="editEntry(item)" :disabled="busy">
                              Edit
                            </button><button
                              class="text-button"
                              @click="removeEntry(item)"
                              :disabled="busy"
                            >
                              Delete
                            </button>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </section>
            </template>
            <section class="market-panel">
              <div class="production-list-heading">
                <h2>Your productions</h2>
                <button class="text-button" @click="load(offset)" :disabled="busy">Refresh</button>
              </div>
              <p
                class="muted production-editor"
                x-show="!items.length"
                x-text="busy?'Loading...':'No productions on this page. Create your first batch above.'"
              ></p>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Product</th>
                      <th>Units</th>
                      <th>Status</th>
                      <th>Invention</th>
                      <th>Materials</th>
                      <th>Manufacturing</th>
                      <th>Income</th>
                      <th>Cash balance</th>
                      <th>Return on costs</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="item in items" :key="item.id">
                      <tr>
                        <td>
                          <button
                            class="text-button production-product"
                            @click="open(item)"
                            :disabled="busy"
                          >
                            <img
                              :src="'https://images.evetech.net/types/'+item.type_id+'/icon?size=32'"
                              alt=""
                              loading="lazy"
                              @error="$el.style.visibility='hidden'"
                            >
                            <span x-text="item.name"></span>
                          </button>
                          <div class="muted production-comment" x-text="item.comment"></div>
                        </td>
                        <td x-text="item.units??'—'"></td>
                        <td x-text="item.status==='completed'?'Completed':'In progress'"></td>
                        <td class="expense-tone" x-text="money(item.totals.invention)"></td>
                        <td class="expense-tone" x-text="money(item.totals.materials)"></td>
                        <td class="expense-tone" x-text="money(item.totals.manufacturing)"></td>
                        <td class="income-tone" x-text="money(item.totals.income)"></td>
                        <td
                          :class="Number(item.totals.balance)<0?'expense-tone':'income-tone'"
                          x-text="money(item.totals.balance)"
                        ></td>
                        <td
                          x-text="item.totals.margin===null?'Not available':Number(item.totals.margin).toFixed(1)+'%'"
                        ></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <div class="production-actions">
                <button
                  class="button secondary"
                  @click="load(Math.max(0,offset-50))"
                  :disabled="busy||offset===0"
                >
                  Previous
                </button><span class="muted" x-text="'Page '+(offset/50+1)"></span><button
                  class="button secondary"
                  @click="load(offset+50)"
                  :disabled="busy||items.length<50"
                >
                  Next
                </button>
              </div>
            </section>
            </div>
          </main>
        </body>
      </html>
