<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Production history - EVE Manufacturing</title>
    <link rel="stylesheet" href="/static/app.css">
    <link rel="stylesheet" href="/static/navigation.css">
    <link rel="stylesheet" href="/static/production.css">
    <script defer src="/ui/config.js"></script>
    <script defer src="/static/api.js"></script>
    <script defer src="/static/page-features.js"></script>
    <script defer src="/static/production/blueprint.js"></script>
    <script defer src="/static/production/estimates.js"></script>
    <script defer src="/static/production/entries.js"></script>
    <script defer src="/static/production/purchases.js"></script>
    <script defer src="/static/production.js"></script>
    <script defer src="/static/freshness.js"></script>
    <script defer src="/static/vendor/alpine.min.js"></script>
    <link rel="stylesheet" href="/static/compact.css">
  </head>
  <body class="compact-page production-page" x-data="productionApp">
    {% set active_page = "production" %}
    {% include "navigation.html" %}
    <main class="workspace">
      <div class="content">
        <div class="page-heading">
          <div>
            <h1>Production history</h1>
          </div>
          <div class="workspace-header-actions">
            {% include "workspace_help.html" %}
            <button class="button primary" @click="startCreate()" :disabled="busy">
              Create production
            </button>
          </div>
        </div>
        <p
          class="error-banner"
          x-show="error"
          x-text="error"
          role="alert"
          x-cloak
        ></p>
        <p
          class="profile-notice"
          x-show="message"
          x-text="message"
          role="status"
          x-cloak
        ></p>
        {% include "production/create.html" %}
        {% include "production/details.html" %}
        {% include "production/list.html" %}
      </div>
    </main>
  </body>
</html>
